<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Pengecekan GBHM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center" data-page="login">
    <div class="w-full max-w-md px-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">GBHM Checker</h1>
            <p class="text-sm text-gray-500 mt-1">Sistem Pengecekan GBHM — masuk untuk melanjutkan</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <div id="alertBox"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" name="username" required autocomplete="username"
                           placeholder="mis. admin"
                           class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required autocomplete="current-password"
                           class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700">
                    Masuk
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 mt-4">Gunakan akun yang diberikan oleh admin.</p>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
