<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Panitia - Sistem Pengecekan GBHM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body class="bg-gray-100 min-h-screen" data-page="panitia">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-xl font-bold text-indigo-600">GBHM Checker</a>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" data-nav="dashboard" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Dashboard</a>
                        <a href="upload.html" data-nav="upload" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Upload</a>
                        <a href="results.html" data-nav="results" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Hasil</a>
                        <a href="panitia.html" data-nav="panitia" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Panitia</a>
                        <a href="quest.html" data-nav="quest" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Quest</a>
                        <a href="rules.html" data-nav="rules" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Rules</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="hidden sm:flex items-center space-x-2 text-sm text-gray-500">
                        <span id="authUsername" class="font-medium text-gray-800">-</span>
                        <span id="authRole" class="px-2 py-0.5 text-xs rounded-full bg-indigo-100 text-indigo-700"></span>
                    </span>
                    <button id="logoutBtn" type="button" class="text-gray-600 hover:text-red-600 px-3 py-2 rounded-md text-sm">Keluar</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-lg shadow">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h1 class="text-xl font-semibold text-gray-800" id="formTitle">Tambah Panitia</h1>
                </div>

                <div class="p-6">
                    <div id="alertBox"></div>

                    <form id="panitiaForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                            <input type="text" name="nama" required
                                   class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
                            <input type="text" name="nim" required
                                   class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jabatan</label>
                            <input type="text" name="jabatan" required
                                   class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Challenge 1</label>
                            <input type="text" name="challenge_1" required
                                   class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Challenge 2</label>
                            <input type="text" name="challenge_2" required
                                   class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Challenge 3</label>
                            <input type="text" name="challenge_3" required
                                   class="w-full border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button type="submit" id="submitBtn"
                                    class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700">
                                Simpan
                            </button>
                            <a href="panitia.html"
                               class="bg-gray-300 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-400">
                                Batal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/pages/panitia-form.js"></script>
</body>
</html>
