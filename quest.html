<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Quest - Sistem Pengecekan GBHM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body class="bg-gray-100 min-h-screen" data-page="quest">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-xl font-bold text-indigo-600">GBHM Checker</a>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" data-nav="dashboard" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Dashboard</a>
                        <a href="upload.html" data-nav="upload" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Upload</a>
                        <a href="results.html" data-nav="results" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Hasil</a>
                        <a href="panitia.html" data-nav="panitia" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Panitia</a>
                        <a href="quest.html" data-nav="quest" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Quest</a>
                        <a href="rules.html" data-nav="rules" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md">Rules</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="hidden sm:flex items-center space-x-2 text-sm text-gray-500">
                        <span id="authUsername" class="font-medium text-gray-800">-</span>
                        <span id="authRole" class="px-2 py-0.5 text-xs rounded-full bg-indigo-100 text-indigo-700"></span>
                    </span>
                    <button id="logoutBtn" type="button" class="text-gray-600 hover:text-red-600 px-3 py-2 rounded-md text-sm">Keluar</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4">
        <div id="alertBox"></div>

        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-gray-800">Data Quest</h1>
                <a href="quest-form.html" data-admin-only
                   class="hidden bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    + Tambah Quest
                </a>
            </div>

            <div class="p-6">
                <form id="filterForm" class="mb-4">
                    <div class="flex gap-2">
                        <select id="chapterFilter" name="chapter" class="border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Semua Chapter</option>
                            <option value="1">Chapter 1</option>
                            <option value="2">Chapter 2</option>
                            <option value="3">Chapter 3</option>
                            <option value="4">Chapter 4</option>
                        </select>
                        <select id="angkatanFilter" name="angkatan" class="border rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Semua Angkatan</option>
                        </select>
                    </div>
                </form>

                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Chapter</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Angkatan</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Jenis Quest</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Deskripsi</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Target</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200" id="questBody">
                            <tr>
                                <td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">Memuat...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/pages/quest.js"></script>
</body>
</html>
